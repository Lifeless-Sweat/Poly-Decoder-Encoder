name: PolyTrack Track Lab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check Node.js
        run: node --version

      - name: Check project files
        run: |
          test -f decoder.js
          test -f encoder.js
          test -f cli.js
          test -f package.json

      - name: Test JavaScript syntax
        run: |
          node --check decoder.js
          node --check encoder.js
          node --check cli.js

      - name: Test CLI help
        run: |
          node cli.js || test $? -eq 1

      - name: Test module loading
        run: |
          node -e "require('./decoder.js')"
          node -e "require('./encoder.js')"

      - name: Test encoder
        run: |
          node - <<'NODE'
          const { encodeExport } = require("./encoder");

          const track = {
            metadata: {
              name: "GitHub Test",
              author: "GitHub Actions"
            },
            track: {
              environmentId: 0,
              sunAngleRepresentation: 0,
              parts: [
                {
                  id: 1,
                  x: 0,
                  y: 0,
                  z: 0,
                  rotation: 0,
                  rotationAxis: 0,
                  color: 0
                }
              ]
            }
          };

          const encoded = encodeExport(track);

          if (!encoded.startsWith("PolyTrack2")) {
            throw new Error("Encoder did not produce PolyTrack2 output");
          }

          console.log("Encoder test passed.");
          console.log(`Generated ${encoded.length} characters.`);
          NODE
