name: PolyTrack Track Lab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check Node.js
        run: node --version

      - name: Check project files
        run: |
          test -f package.json
          test -f README.md
          test -f cli.js
          test -f decoder.js
          test -f encoder.js
          test -f test.js

      - name: Check JavaScript syntax
        run: |
          node --check cli.js
          node --check decoder.js
          node --check encoder.js
          node --check test.js

      - name: Test module loading
        run: |
          node -e "const d = require('./decoder.js'); if (typeof d.decodeInput !== 'function') process.exit(1)"
          node -e "const e = require('./encoder.js'); if (typeof e.encodeExport !== 'function') process.exit(1)"

      - name: Run tests
        run: npm test
